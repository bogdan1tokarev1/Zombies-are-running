[mod]
id = "zombies_are_running"
version = "1.1.0"
priority = 100

# The commit it was tested on (Nightly 2026-11-07). It hooks the native hook
# points for entity ticks, and the mob's movement speed for the burst's speed:
# that one names a function of the game's own source, so the launcher builds it
# on this commit.
[compatibility]
horizon_revision = "2ebf00a0281c592f79191e76fce0e7d522c6f425"

# runtime.rs becomes the module crate::zombies_are_running of horizon-client-lib (whose
# mob AI the game calls): the game crate and the library both reach it, so the
# cycles and the mob's speed share one state.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/client_lib.rs"
name = "zombies_are_running"
visibility = "pub"
source = "runtime.rs"

# The server tells entity ticks only to a mod that asks for them.
[[injection]]
id = "listen"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_entity_tick_listened"
helper = "listen.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "listened", ty = "&mut bool", value = "&mut *listened" },
]

# Every ticking entity: the zombie's cycle moves on a tick.
[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_entity_tick_pre"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "entity", ty = "u32", value = "entity" },
  { name = "kind", ty = "&str", value = "kind" },
]

# A zombie's movement speed: the burst's factor.
[[injection]]
id = "speed"
kind = "RETURN"
target = "horizon_client_lib::mobs::Mob::movement_speed"
helper = "speed.rs"
bindings = [
  { name = "value", ty = "f64", value = "$value" },
  { name = "mob", ty = "&crate::mobs::Mob", value = "self" },
]

# Its row in Options > Mods, with its settings page.
[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
